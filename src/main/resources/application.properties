spring.application.name=jaderegent

# Use the local profile by default; SPRING_PROFILES_ACTIVE or another explicit
# profile can replace it in deployed environments.
spring.profiles.default=local

# Server Configuration for LAN access
server.address=0.0.0.0
server.port=8080

# MariaDB connection. Override all DB_* variables in deployed environments.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/gestion_relaciones}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USERNAME:jaderegent}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Flyway owns schema creation and evolution.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

# Jackson Configuration
spring.jackson.property-naming-strategy=SNAKE_CASE
